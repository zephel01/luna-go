name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Default to read-only; jobs that need write access opt in explicitly.
permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────
  # 1. Secret scan (gitleaks) — Git 履歴全体を対象
  # ──────────────────────────────────────────────
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for gitleaks
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ──────────────────────────────────────────────
  # 2. Vet / Build / Test
  # ──────────────────────────────────────────────
  build:
    name: Vet / Build / Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version   # 1.22.5 を確実にピン
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -ldflags "-s -w" -o luna .

      - name: Test
        run: |
          go test \
            -race \
            -count=1 \
            -timeout 60s \
            -coverprofile=coverage.out \
            ./internal/...

      - name: Coverage summary
        run: go tool cover -func=coverage.out | tail -1

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # ──────────────────────────────────────────────
  # 3. CVE スキャン (govulncheck) — Go 公式脆弱性 DB
  # ──────────────────────────────────────────────
  vuln-scan:
    name: Vulnerability Scan (govulncheck)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: .go-version
          cache: true
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...

  # ──────────────────────────────────────────────
  # 4. PR 時: 新規依存の Critical/High を自動ブロック
  # ──────────────────────────────────────────────
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
